<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Карта исследования психики — Тест СП-10+</title>
  <link rel="stylesheet" href="https://unpkg.com" />
  <script src="https://unpkg.com"></script>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --border: #334155; --text: #f8fafc; --muted: #94a3b8; --accent: #38bdf8; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; padding: 16px; }
    .container { max-width: 1200px; margin: 0 auto; }
    header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
    h1 { font-size: 1.4rem; }
    .subtitle { color: var(--muted); font-size: 0.9rem; }
    .btn { display: inline-block; padding: 10px 16px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 0.9rem; cursor: pointer; border: none; }
    .btn-primary { background: var(--accent); color: #0f172a; }
    .btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    .filters { display: flex; flex-wrap: wrap; gap: 12px; background: var(--card); padding: 14px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
    .filter-group { display: flex; flex-direction: column; gap: 4px; min-width: 160px; flex: 1; }
    label { font-size: 0.8rem; color: var(--muted); }
    select { background: var(--bg); color: var(--text); border: 1px solid var(--border); padding: 8px 10px; border-radius: 8px; font-size: 0.9rem; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 20px; }
    .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
    .stat-title { font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
    .stat-values { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
    .stat-score { font-size: 1.35rem; font-weight: 700; color: var(--accent); }
    .stat-pct { font-size: 1rem; font-weight: 600; color: #e2e8f0; }
    .bar-bg { height: 8px; background: var(--bg); border-radius: 99px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 99px; transition: width 0.4s ease; }
    #map { height: 480px; width: 100%; border-radius: 14px; border: 1px solid var(--border); margin-bottom: 20px; z-index: 1; }
    .status-bar { text-align: center; padding: 12px; color: var(--muted); font-size: 0.9rem; }
    .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #1e293b; color: #f8fafc; border: 1px solid #334155; }
    .popup-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.85rem; }
    .popup-table td { padding: 3px 4px; border-bottom: 1px solid #334155; }
    .popup-table td:last-child { text-align: right; font-weight: 600; color: #38bdf8; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>Глобальная карта исследования СП-10+</h1>
      <div class="subtitle" id="summaryLine">Загрузка данных из научной базы...</div>
    </div>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <button class="btn btn-secondary" onclick="downloadCSV()">Скачать CSV для учёных</button>
      <a href="index.html" class="btn btn-primary">← Пройти тест</a>
    </div>
  </header>

  <div class="filters">
    <div class="filter-group">
      <label for="filterGender">Пол</label>
      <select id="filterGender" onchange="applyFilters()">
        <option value="all">Все участники</option>
        <option value="Мужской">Мужской</option>
        <option value="Женский">Женский</option>
      </select>
    </div>
    <div class="filter-group">
      <label for="filterAge">Возрастная группа</label>
      <select id="filterAge" onchange="applyFilters()">
        <option value="all">Любой возраст</option>
        <option value="under18">До 18 лет</option>
        <option value="18-25">18–25 лет</option>
        <option value="26-40">26–40 лет</option>
        <option value="41+">41 год и старше</option>
      </select>
    </div>
    <div class="filter-group">
      <label for="filterScaleColor">Подсветка точек на карте по шкале</label>
      <select id="filterScaleColor" onchange="applyFilters()">
        <option value="Тревожность">Тревожность</option>
        <option value="Стресс">Стресс</option>
        <option value="Нейротизм">Нейротизм</option>
        <option value="Эмпатия">Эмпатия</option>
        <option value="Доброжелательность">Доброжелательность</option>
        <option value="Привязанность">Привязанность</option>
      </select>
    </div>
  </div>

  <div class="stats-grid" id="statsGrid"></div>
  <div id="map"></div>
  <div class="status-bar" id="statusBar">
    Координаты определяются автоматически по указанному городу. Точные адреса и личные комментарии не публикуются.
  </div>
</div>
<script>
  const SCRIPT_URL = "https://" + "script.google." + "com/macros/s/" + "AKfycbwR3QQHD9SSKZhtseOSkVlq83mOXJ1ZrP1dDBvC6RxlXwoKXIySEkvYbT7cHIvrYGX7/exec";

  const SCALES = [
    { key: "Доброжелательность", color: "#22c55e", max: 10 },
    { key: "Нейротизм",          color: "#f97316", max: 10 },
    { key: "Эмпатия",            color: "#38bdf8", max: 10 },
    { key: "Привязанность",      color: "#a855f7", max: 10 },
    { key: "Тревожность",        color: "#eab308", max: 10 },
    { key: "Стресс",             color: "#ef4444", max: 10 }
  ];

  let rawData = [];
  let filteredData = [];

  const map = L.map("map").setView([55.75, 37.61], 3);
  L.tileLayer("https://{s}://{z}/{x}/{y}{r}.png", {
    attribution: "&copy; OpenStreetMap &copy; CARTO",
    maxZoom: 18
  }).addTo(map);
  const markersLayer = L.layerGroup().addTo(map);

  async function loadData() {
    try {
      const res = await fetch(SCRIPT_URL);
      rawData = await res.json();
      SCALES.forEach(s => {
        const maxVal = Math.max(...rawData.map(r => parseFloat(r[s.key]) || 0), s.max);
        if (maxVal > 10) s.max = Math.ceil(maxVal / 5) * 5;
      });
      applyFilters();
    } catch (e) {
      document.getElementById("summaryLine").textContent = "Пока нет записей. Пройдите тест первым!";
    }
  }

  function applyFilters() {
    const gender = document.getElementById("filterGender").value;
    const ageGroup = document.getElementById("filterAge").value;

    filteredData = rawData.filter(row => {
      if (gender !== "all" && String(row["Пол"]).trim() !== gender) return false;
      const age = parseInt(row["Возраст"], 10);
      if (ageGroup === "under18" && !(age < 18)) return false;
      if (ageGroup === "18-25" && !(age >= 18 && age <= 25)) return false;
      if (ageGroup === "26-40" && !(age >= 26 && age <= 40)) return false;
      if (ageGroup === "41+" && !(age >= 41)) return false;
      return true;
    });

    renderStats();
    renderMap();
  }

  function calcAverages(rows) {
    const result = {};
    SCALES.forEach(s => {
      const vals = rows.map(r => parseFloat(r[s.key])).filter(v => !isNaN(v));
      const avg = vals.length ? (vals.reduce((a, b) => a + b, 0) / vals.length) : 0;
      const pct = s.max ? Math.min(100, Math.round((avg / s.max) * 100)) : 0;
      result[s.key] = { avg: avg.toFixed(1), pct, max: s.max, color: s.color };
    });
    return result;
  }

  function renderStats() {
    const grid = document.getElementById("statsGrid");
    const summary = document.getElementById("summaryLine");
    const total = filteredData.length;
    const citiesCount = new Set(filteredData.map(r => r["Город"]).filter(Boolean)).size;
    summary.textContent = `Выборка: ${total} чел. • География: ${citiesCount} городов/регионов`;

    if (total === 0) {
      grid.innerHTML = `<div class="stat-card">Нет данных по выбранным фильтрам</div>`;
      return;
    }

    const avgs = calcAverages(filteredData);
    grid.innerHTML = SCALES.map(s => {
      const item = avgs[s.key];
      return `<div class="stat-card"><div class="stat-title">${s.key} (макс. ${item.max})</div><div class="stat-values"><span class="stat-score">${item.avg} б.</span><span class="stat-pct">${item.pct}%</span></div><div class="bar-bg"><div class="bar-fill" style="width:${item.pct}%; background:${item.color};"></div></div></div>`;
    }).join("");
  }

  function renderMap() {
    markersLayer.clearLayers();
    const activeScale = document.getElementById("filterScaleColor").value;
const SCRIPT_URL = "https://" + "script.google." + "com/macros/s/" + "AKfycbwR3QQHD9SSKZhtseOSkVlq83mOXJ1ZrP1dDBvC6RxlXwoKXIySEkvYbT7cHIvrYGX7/exec";

const CITIES = {
  "москва": { lat: 55.7558, lng: 37.6173 },
  "санкт-петербург": { lat: 59.9343, lng: 30.3351 },
  "питер": { lat: 59.9343, lng: 30.3351 },
  "новосибирск": { lat: 55.0084, lng: 82.9357 },
  "екатеринбург": { lat: 56.8389, lng: 60.6057 },
  "казань": { lat: 55.7961, lng: 49.1064 },
  "нижний новгород": { lat: 56.3269, lng: 44.0059 },
  "челябинск": { lat: 55.1644, lng: 61.4368 },
  "самара": { lat: 53.1959, lng: 50.1002 },
  "омск": { lat: 54.9885, lng: 73.3242 },
  "ростов-на-дону": { lat: 47.2357, lng: 39.7015 },
  "ростов": { lat: 47.2357, lng: 39.7015 },
  "уфа": { lat: 54.7388, lng: 55.9721 },
  "красноярск": { lat: 56.0153, lng: 92.8932 },
  "воронеж": { lat: 51.6755, lng: 39.2089 },
  "пермь": { lat: 58.0105, lng: 56.2502 },
  "волгоград": { lat: 48.7080, lng: 44.5133 },
  "краснодар": { lat: 45.0355, lng: 38.9753 },
  "саратов": { lat: 51.5336, lng: 46.0343 },
  "тюмень": { lat: 57.1522, lng: 65.5272 },
  "минск": { lat: 53.9006, lng: 27.5590 },
  "алматы": { lat: 43.2220, lng: 76.8512 },
  "астана": { lat: 51.1605, lng: 71.4704 },
  "ташкент": { lat: 41.2995, lng: 69.2401 },
  "киев": { lat: 50.4501, lng: 30.5234 }
};

const TZ_FALLBACK = {
  "Europe/Moscow": { lat: 55.75, lng: 37.61 },
  "Europe/Samara": { lat: 53.19, lng: 50.10 },
  "Asia/Yekaterinburg": { lat: 56.83, lng: 60.60 },
  "Asia/Omsk": { lat: 54.98, lng: 73.32 },
  "Asia/Novosibirsk": { lat: 55.00, lng: 82.93 },
  "Asia/Krasnoyarsk": { lat: 56.01, lng: 92.89 },
  "Asia/Irkutsk": { lat: 52.28, lng: 104.28 },
  "Asia/Vladivostok": { lat: 43.11, lng: 131.88 },
  "Europe/Minsk": { lat: 53.90, lng: 27.55 },
  "Asia/Almaty": { lat: 43.22, lng: 76.85 }
};

let allRows = [];
let mapInstance = null;
let markersLayer = null;

function setStatus(text) {
  const els = document.querySelectorAll("p, div");
  for (let i = 0; i < els.length; i++) {
    const el = els.item(i);
    if (el.children.length === 0 && el.textContent.indexOf("Загрузка") !== -1) {
      el.textContent = text;
      return;
    }
  }
  const sub = document.querySelector("p");
  if (sub) sub.textContent = text;
}

function getCoords(row) {
  const rawCity = String(row["Город"] || "").trim().toLowerCase();
  if (CITIES[rawCity]) return CITIES[rawCity];
  for (const key in CITIES) {
    if (rawCity && rawCity.indexOf(key) !== -1) return CITIES[key];
  }
  const tz = String(row["Часовой пояс"] || "").trim();
  if (TZ_FALLBACK[tz]) return TZ_FALLBACK[tz];
  return { lat: 55.75, lng: 37.61 };
}

function getColor(val, maxVal) {
  const ratio = Math.min(1, Math.max(0, Number(val || 0) / maxVal));
  if (ratio < 0.4) return "#22c55e";
  if (ratio < 0.7) return "#eab308";
  return "#ef4444";
}

function renderMarkers() {
  if (!mapInstance || !markersLayer) return;
  markersLayer.clearLayers();

  const selects = document.querySelectorAll("select");
  const s0 = selects.item(0);
  const s1 = selects.item(1);
  const s2 = selects.item(2);

  const genderFilter = s0 ? s0.value : "";
  const ageFilter = s1 ? s1.value : "";
  const scaleName = s2 ? s2.options.item(s2.selectedIndex).text : "Тревожность";

  const maxMap = {
    "Тревожность": 24,
    "Стресс": 20,
    "Нейротизм": 30,
    "Доброжелательность": 36,
    "Эмпатия": 28,
    "Привязанность": 30
  };
  const maxVal = maxMap[scaleName] || 25;

  let shown = 0;
  allRows.forEach(function(row, idx) {
    const g = String(row["Пол"] || "");
    const age = Number(row["Возраст"] || 0);

    if (genderFilter && genderFilter !== "all" && genderFilter !== "Все участники" && g !== genderFilter) return;
    if (ageFilter === "under18" && age >= 18) return;
    if (ageFilter === "18-25" && (age < 18 || age > 25)) return;
    if (ageFilter === "26-40" && (age < 26 || age > 40)) return;
    if (ageFilter === "40plus" && age <= 40) return;

    const base = getCoords(row);
    const jitterLat = ((idx * 37) % 10 - 5) * 0.02;
    const jitterLng = ((idx * 53) % 10 - 5) * 0.02;
    const score = row[scaleName] !== undefined ? row[scaleName] : row["Тревожность"];
    const color = getColor(score, maxVal);

    const marker = L.circleMarker([base.lat + jitterLat, base.lng + jitterLng], {
      radius: 9,
      fillColor: color,
      color: "#ffffff",
      weight: 2,
      opacity: 1,
      fillOpacity: 0.85
    });

    marker.bindPopup(
      "<b>" + (row["Город"] || "Город не указан") + "</b> (" + g + ", " + age + " лет)<br>" +
      "Статус: <b>" + (row["Статус"] || "-") + "</b><br>" +
      "Доброжелательность: " + (row["Доброжелательность"] || 0) + "<br>" +
      "Нейротизм: " + (row["Нейротизм"] || 0) + "<br>" +
      "Эмпатия: " + (row["Эмпатия"] || 0) + "<br>" +
      "Привязанность: " + (row["Привязанность"] || 0) + "<br>" +
      "Тревожность: " + (row["Тревожность"] || 0) + "<br>" +
      "Стресс: " + (row["Стресс"] || 0)
    );
    marker.addTo(markersLayer);
    shown++;
  });

  setStatus("На карте показаны точки: " + shown + " из " + allRows.length + " анкет");
}

window.downloadCSV = function() {
  if (!allRows.length) {
    alert("Нет данных для выгрузки");
    return;
  }
  const firstRow = allRows.slice(0, 1).pop();
  const keys = Object.keys(firstRow);
  const lines = [keys.join(";")];
  allRows.forEach(function(r) {
    lines.push(keys.map(function(k) { return '"' + String(r[k] || "").replace(/"/g, '""') + '"'; }).join(";"));
  });
  const blob = new Blob(["\uFEFF" + lines.join("\n")], { type: "text/csv;charset=utf-8;" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "sp10plus_data.csv";
  a.click();
};

function startMap() {
  const mapEl = document.getElementById("map");
  if (!mapEl) return;
  mapEl.style.height = "420px";
  mapEl.style.borderRadius = "12px";

  mapInstance = L.map("map").setView([55.75, 45.0], 3);
  const tileUrl = "https://{s}.basemaps." + "cartocdn." + "com/dark_all/{z}/{x}/{y}{r}.png";
  L.tileLayer(tileUrl, { maxZoom: 18 }).addTo(mapInstance);
  markersLayer = L.layerGroup().addTo(mapInstance);

  document.querySelectorAll("select").forEach(function(sel) {
    sel.addEventListener("change", renderMarkers);
  });

  fetch(SCRIPT_URL)
    .then(function(r) { return r.json(); })
    .then(function(data) {
      allRows = Array.isArray(data) ? data : [];
      renderMarkers();
    })
    .catch(function() {
      setStatus("Не удалось загрузить данные из таблицы");
    });
}

(function loadLeaflet() {
  const css = document.createElement("link");
  css.rel = "stylesheet";
  css.href = "https://" + "unpkg." + "com/leaflet@1.9.4/dist/leaflet.css";
  document.head.appendChild(css);

  const scr = document.createElement("script");
  scr.src = "https://" + "unpkg." + "com/leaflet@1.9.4/dist/leaflet.js";
  scr.onload = startMap;
  document.head.appendChild(scr);
})();
