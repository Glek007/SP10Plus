<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тест СП-10+</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #121212; color: #f0f0f0; margin: 0; padding: 16px; line-height: 1.5; }
    .box { max-width: 680px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 12px; }
    h1, h2, h3 { color: #ffffff; margin-top: 0; }
    .note { background: #2a2a2a; padding: 12px; border-radius: 8px; font-size: 14px; color: #cccccc; margin-bottom: 16px; }
    .q-card { background: #252525; padding: 14px; border-radius: 8px; margin-bottom: 12px; }
    .q-title { font-weight: 600; margin-bottom: 10px; }
    .opts { display: flex; flex-wrap: wrap; gap: 8px; }
    .opts label { background: #333; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; flex: 1; text-align: center; min-width: 44px; }
    select, input, textarea { width: 100%; box-sizing: border-box; padding: 10px; margin: 6px 0 14px; border-radius: 8px; border: 1px solid #444; background: #2a2a2a; color: #fff; font-size: 16px; }
    .opts input { width: auto; margin: 0 4px 0 0; }
    button { width: 100%; padding: 14px; background: #2ea44f; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 8px; }
    .tg-btn { display: block; text-align: center; background: #0088cc; color: #fff; text-decoration: none; padding: 14px; border-radius: 8px; font-weight: bold; margin-top: 14px; }
    .hidden { display: none; }
    .err { color: #ff6b6b; font-weight: bold; margin-top: 10px; }
    .ok { color: #51cf66; font-weight: bold; }
  </style>
</head>
<body>
<div class="box">
  <h1>ТЕСТ СП-10+</h1>
  <div id="gate-screen">
    <div class="note">Не является медицинским изделием, не предназначено для постановки диагнозов и имеет исключительно ознакомительный характер.</div>
    <label>Ваш пол:</label>
    <select id="user-gender">
      <option value="">-- Выберите пол --</option>
      <option value="Мужской">Мужской</option>
      <option value="Женский">Женский</option>
    </select>
    <label>Ваш возраст (полных лет):</label>
    <input type="number" id="user-age" min="1" max="120" placeholder="Введите возраст">
    <button type="button" onclick="checkAccess()">Начать тест</button>
    <div id="gate-msg" class="err"></div>
  </div>
  <div id="test-screen" class="hidden"></div>
  <div id="result-screen" class="hidden"></div>
</div>
<script>
  const TG_CHAT_URL = "https://t.me";
  const EMAIL = "gleb95052@gmail.com";
  let userGender = "", userAge = 0;

  const questions = new Array(
    {t:"Я склонен доверять людям, пока они не докажут обратное.",s:1,r:0},
    {t:"Мне нравится помогать другим, даже если это невыгодно.",s:1,r:0},
    {t:"Я стараюсь избегать конфликтов.",s:1,r:1},
    {t:"Я считаю, что большинство людей в основе своей хорошие.",s:1,r:0},
    {t:"Я легко прощаю обиды.",s:1,r:0},
    {t:"Мне трудно говорить «нет».",s:1,r:1},
    {t:"Я чувствую себя заряженным после общения с людьми.",s:2,r:0},
    {t:"Я легко завожу новые знакомства.",s:2,r:0},
    {t:"Я часто оказываюсь в центре внимания.",s:2,r:0},
    {t:"Мне нравится быть в шумных компаниях.",s:2,r:0},
    {t:"Я говорю громко и уверенно.",s:2,r:0},
    {t:"Я предпочитаю активный отдых с людьми, а не одиночество.",s:2,r:0},
    {t:"Я часто чувствую тревогу без причины.",s:3,r:0},
    {t:"Моё настроение часто меняется.",s:3,r:0},
    {t:"Я легко расстраиваюсь из-за мелочей.",s:3,r:0},
    {t:"Я часто чувствую себя уставшим и разбитым.",s:3,r:0},
    {t:"Мне трудно расслабиться.",s:3,r:0},
    {t:"Я склонен к самокритике.",s:3,r:0},
    {t:"Я легко понимаю точку зрения другого человека.",s:4,r:0},
    {t:"Я могу представить, что чувствует другой, даже если не согласен с ним.",s:4,r:0},
    {t:"Я часто анализирую мотивы поведения людей.",s:4,r:0},
    {t:"Мне интересно, почему люди поступают так, а не иначе.",s:4,r:0},
    {t:"Я замечаю, когда человек говорит одно, а думает другое.",s:4,r:0},
    {t:"Мне больно видеть, как страдают другие.",s:5,r:0},
    {t:"Я часто сопереживаю героям фильмов или книг.",s:5,r:0},
    {t:"Я чувствую чужую радость как свою.",s:5,r:0},
    {t:"Мне трудно оставаться равнодушным, когда кто-то плачет.",s:5,r:0},
    {t:"Я часто думаю о чувствах других людей.",s:5,r:0},
    {t:"Я боюсь, что меня бросят.",s:6,r:1},
    {t:"Мне трудно полностью довериться партнёру.",s:6,r:1},
    {t:"Я часто нуждаюсь в подтверждении, что меня любят.",s:6,r:1},
    {t:"Я чувствую себя некомфортно, когда кто-то хочет слишком близко.",s:6,r:1},
    {t:"Я легко сближаюсь с людьми.",s:6,r:0},
    {t:"Мне важно, чтобы партнёр был рядом постоянно.",s:6,r:1},
    {t:"Нервничаю при разговоре с незнакомцем.",s:7,r:0},
    {t:"Боюсь, что меня осудят.",s:7,r:0},
    {t:"Избегаю звонить по телефону.",s:7,r:0},
    {t:"Мне трудно выступать перед группой.",s:7,r:0},
    {t:"Чувствую дискомфорт на вечеринках.",s:7,r:0},
    {t:"Предпочитаю писать, а не говорить.",s:7,r:0},
    {t:"Я люблю пробовать новое.",s:8,r:0},
    {t:"Мне нравятся необычные идеи.",s:8,r:0},
    {t:"Я легко меняю своё мнение под влиянием новых фактов.",s:8,r:0},
    {t:"Я интересуюсь искусством, философией или наукой.",s:8,r:0},
    {t:"Я предпочитаю разнообразие, а не рутину.",s:8,r:0},
    {t:"Я часто делаю что-то, не подумав.",s:9,r:0},
    {t:"Я легко поддаюсь соблазнам.",s:9,r:0},
    {t:"Я могу потратить деньги, не планируя.",s:9,r:0},
    {t:"Я часто меняю решения в последний момент.",s:9,r:0},
    {t:"Мне трудно ждать.",s:9,r:0},
    {t:"Я чувствовал напряжение.",s:10,r:0},
    {t:"Мне было трудно заснуть из-за мыслей.",s:10,r:0},
    {t:"Я раздражался по мелочам.",s:10,r:0},
    {t:"Я чувствовал, что не справляюсь.",s:10,r:0},
    {t:"Я чувствовал усталость без причины.",s:10,r:0}
  );

  const lieQuestions = new Array(
    "Л1. Я никогда не опаздываю.",
    "Л2. Я никогда никого не осуждал.",
    "Л3. Я всегда говорю только правду.",
    "Л4. Я никогда не раздражался на близких.",
    "Л5. Я всегда выполняю обещания."
  );

  const sitQuestions = new Array(
    {t:"С1. Коллега занял вашу идею и выдал за свою. Что вы сделаете?",opts:new Array("1) Промолчу","2) Скажу ему наедине","3) Скажу при всех","4) Пожалуюсь начальнику"),sc:new Array(1,3,2,1),s:1},
    {t:"С2. Друг просит денег в долг, а вы знаете, что он не вернёт.",opts:new Array("1) Дам","2) Откажу","3) Дам половину","4) Скажу, что нет денег"),sc:new Array(3,1,2,1),s:1},
    {t:"С3. Вы видите, что незнакомец плачет на улице.",opts:new Array("1) Подойду","2) Пройду мимо","3) Позвоню кому-то","4) Зависит от ситуации"),sc:new Array(3,1,2,2),s:5}
  );

  function checkAccess() {
    userGender = document.getElementById("user-gender").value;
    userAge = parseInt(document.getElementById("user-age").value, 10);
    const msg = document.getElementById("gate-msg");

    if (!userGender || isNaN(userAge)) {
      msg.textContent = "Пожалуйста, выберите пол и укажите возраст.";
      return;
    }
    const okMale = (userGender === "Мужской" && userAge >= 9 && userAge <= 15);
    const okFemale = (userGender === "Женский" && userAge >= 8 && userAge <= 14);

    if (!okMale && !okFemale) {
      msg.textContent = "К сожалению, методика откалибрована только для мужчин 9–15 лет и женщин 8–14 лет.";
      return;
    }
    document.getElementById("gate-screen").classList.add("hidden");
    document.getElementById("test-screen").classList.remove("hidden");
    renderTest();
  }

  function renderTest() {
    let html = `<div class="note"><b>Инструкция:</b><br>Шкалы 1–6, 8, 9: от 1 (совсем не про меня) до 5 (точно про меня).<br>Шкалы 7 и 10: от 0 (никогда) до 4 (всегда).</div>`;
    questions.forEach((q, i) => {
      const min = (q.s === 7 || q.s === 10) ? 0 : 1;
      const max = (q.s === 7 || q.s === 10) ? 4 : 5;
      html += `<div class="q-card"><div class="q-title">${i + 1}. ${q.t}</div><div class="opts">`;
      for (let v = min; v <= max; v++) {
        html += `<label><input type="radio" name="q${i}" value="${v}">${v}</label>`;
      }
      html += `</div></div>`;
    });

    html += `<h3>Шкала достоверности (1 — Да, 0 — Нет)</h3>`;
    lieQuestions.forEach((lq, i) => {
      html += `<div class="q-card"><div class="q-title">${lq}</div><div class="opts">
        <label><input type="radio" name="l${i}" value="1">1 (Да)</label>
        <label><input type="radio" name="l${i}" value="0">0 (Нет)</label>
      </div></div>`;
    });

    html += `<h3>Ситуационные вопросы</h3>`;
    sitQuestions.forEach((sq, i) => {
      html += `<div class="q-card"><div class="q-title">${sq.t}</div>`;
      sq.opts.forEach((opt, idx) => {
        html += `<div style="margin:6px 0;"><label><input type="radio" name="s${i}" value="${idx}"> ${opt}</label></div>`;
      });
      html += `</div>`;
    });

    html += `<button type="button" onclick="finishTest()">Узнать результат</button><div id="test-err" class="err"></div>`;
    document.getElementById("test-screen").innerHTML = html;
  }
    let finalData = {};

  function finishTest() {
    const err = document.getElementById("test-err");
    const sums = new Map();
    for (let k = 1; k <= 10; k++) sums.set(k, 0);

    for (let i = 0; i < questions.length; i++) {
      const el = document.querySelector(`input[name="q${i}"]:checked`);
      if (!el) { err.textContent = `Ответьте на вопрос №${i + 1}`; return; }
      const q = questions.at(i);
      const val = parseInt(el.value, 10);
      const min = (q.s === 7 || q.s === 10) ? 0 : 1;
      const max = (q.s === 7 || q.s === 10) ? 4 : 5;
      const add = q.r ? (max + min - val) : val;
      sums.set(q.s, sums.get(q.s) + add);
    }

    let lieYes = 0;
    for (let i = 0; i < lieQuestions.length; i++) {
      const el = document.querySelector(`input[name="l${i}"]:checked`);
      if (!el) { err.textContent = `Ответьте на вопрос достоверности Л${i + 1}`; return; }
      if (el.value === "1") lieYes++;
    }

    for (let i = 0; i < sitQuestions.length; i++) {
      const el = document.querySelector(`input[name="s${i}"]:checked`);
      if (!el) { err.textContent = `Ответьте на ситуационный вопрос С${i + 1}`; return; }
      const sq = sitQuestions.at(i);
      const pts = sq.sc.at(parseInt(el.value, 10));
      sums.set(sq.s, sums.get(sq.s) + pts);
    }

    document.getElementById("test-screen").classList.add("hidden");
    const res = document.getElementById("result-screen");
    res.classList.remove("hidden");
    window.scrollTo(0, 0);

    if (lieYes >= 3) {
      res.innerHTML = `<h2 class="err">⚠ РЕЗУЛЬТАТ НЕДОСТОВЕРЕН (шкала лжи: ${lieYes} из 5)</h2>
        <p>Рекомендации не выдаются. Пройдите тест заново честно.</p>
        <button type="button" onclick="location.reload()">Пройти заново</button>`;
      return;
    }

    const names = new Array(
      "", "Доброжелательность", "Экстраверсия", "Нейротизм",
      "Когнитивная эмпатия", "Эмоциональная эмпатия", "Привязанность (надёжность)",
      "Социальная тревожность", "Открытость опыту", "Импульсивность", "Текущий стресс"
    );

    let scoresHtml = "<h2>РЕЗУЛЬТАТЫ</h2><div class='note'>";
    let scoresText = "";
    for (let s = 1; s <= 10; s++) {
      scoresHtml += `<div><b>${names.at(s)}:</b> ${sums.get(s)} баллов</div>`;
      scoresText += `${names.at(s)}: ${sums.get(s)}; `;
    }
    scoresHtml += "</div>";

    const dobro = sums.get(1);
    const neuro = sums.get(3);
    const emocEmp = sums.get(5);
    const privyaz = sums.get(6);
    const trevoga = sums.get(7);
    const stress = sums.get(10);

    const okT = trevoga <= 10;
    const okN = neuro <= 14;
    const okP = privyaz >= 20;
    const okS = stress <= 8;
    const okBase = (dobro >= 20) || (emocEmp >= 18);
    const inTarget = okT && okN && okP && okS && okBase;

    let verdictHtml = "<h2>ВЕРДИКТ ПРОГРАММЫ</h2>";
    if (!inTarget) {
      verdictHtml += `<p class="err">❌ ВЫ НЕ ВХОДИТЕ В ЦЕЛЕВУЮ ГРУППУ.</p>
        <p>Ваш профиль показывает, что поведенческий протокол сам по себе не даст нужного эффекта:</p><ul>`;
      if (!okT) verdictHtml += `<li>Тревожность слишком высокая (${trevoga}). Нужно снижать.</li>`;
      if (!okN) verdictHtml += `<li>Нейротизм слишком высокий (${neuro}). Нужна работа с эмоциями.</li>`;
      if (!okP) verdictHtml += `<li>Способность к привязанности низкая (${privyaz}). Нужна терапия.</li>`;
      if (!okS) verdictHtml += `<li>Текущий стресс высокий (${stress}). Сначала антистресс.</li>`;
      if (!okBase) verdictHtml += `<li>Недостаточно выражена базовая эмпатия и доброжелательность.</li>`;
      verdictHtml += `</ul><p><b>Рекомендация:</b> обратитесь к специалисту.</p>`;
    } else {
      verdictHtml += `<p class="ok">✅ ВЫ ВХОДИТЕ В ЦЕЛЕВУЮ ГРУППУ!</p>
        <p>У вас есть природная основа для эффекта.</p>
        <div class="note"><h3>ПРОТОКОЛ УЛУЧШЕНИЯ РАБОТЫ МОЗГА (30 дней)</h3>
        <ol>
          <li>Объятия с близкими — 8 раз в день по 20 секунд.</li>
          <li>Смех — ежедневно (комедии, игры, шутки).</li>
          <li>Пение (хор, караоке, в душе) — 3–4 раза в неделю.</li>
          <li>Питомцы — гладить 10–15 минут в день.</li>
          <li>Природа — 30 минут в день (лес, вода, парк).</li>
          <li>Волонтёрство — 1–2 часа в неделю.</li>
          <li>Медитация любящей доброты — 10 минут в день.</li>
          <li>Сон — 7–9 часов, ложиться до 23:00.</li>
        </ol>
        <b>Это ваш новый образ жизни! 30 дней минимум.</b></div>`;
    }

    finalData = { target: inTarget ? "ЦЕЛЕВАЯ" : "НЕ ЦЕЛЕВАЯ", inTarget, scores: scoresText };

    const formHtml = `<hr style="border-color:#333; margin:20px 0;">
      <h3>Обратная связь по тесту (анонимно)</h3>
      <label>Насколько точным оказался результат?</label>
      <select id="fb-rating">
        <option value="5">5 — Совсем точно</option>
        <option value="4">4 — Скорее точно</option>
        <option value="3">3 — Средне</option>
        <option value="2">2 — Скорее не точно</option>
        <option value="1">1 — Совсем не точно</option>
      </select>
      <label>Ваш город:</label>
      <input type="text" id="fb-city" placeholder="Например: Москва">
      <label>Часовой пояс:</label>
      <select id="fb-tz">
        <option value="UTC+2">UTC+2 (Калининград)</option>
        <option value="UTC+3" selected>UTC+3 (Москва)</option>
        <option value="UTC+4">UTC+4 (Самара)</option>
        <option value="UTC+5">UTC+5 (Екатеринбург)</option>
        <option value="UTC+6">UTC+6 (Омск)</option>
        <option value="UTC+7">UTC+7 (Красноярск / Новосибирск)</option>
        <option value="UTC+8">UTC+8 (Иркутск)</option>
        <option value="UTC+9">UTC+9 (Якутск)</option>
        <option value="UTC+10">UTC+10 (Владивосток)</option>
      </select>
      <label>Комментарий (впечатления, что совпало, а что нет):</label>
      <textarea id="fb-comment" rows="3" placeholder="Напишите пару слов..."></textarea>
      <button type="button" id="send-btn" onclick="sendFeedback()">Отправить отзыв</button>
      <div id="fb-done"></div>`;

    res.innerHTML = scoresHtml + verdictHtml + formHtml;
  }

  function sendFeedback() {
    const btn = document.getElementById("send-btn");
    const rating = document.getElementById("fb-rating").value;
    const city = document.getElementById("fb-city").value.trim() || "Не указан";
    const tz = document.getElementById("fb-tz").value;
    const comment = document.getElementById("fb-comment").value.trim() || "Без комментария";

    btn.disabled = true;
    btn.textContent = "Отправка...";

    const payload = {
      _subject: `СП-10+ | ${finalData.target} | ${city} (${tz}) | Точность: ${rating}/5`,
      _captcha: "false",
      Статус: finalData.target,
      Пол: userGender,
      Возраст: userAge,
      Город: city,
      Часовой_пояс: tz,
      Точность: rating + " из 5",
      Комментарий: comment,
      Баллы: finalData.scores
    };

    fetch("https://formsubmit.co" + EMAIL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify(payload)
    })
    .then(r => r.json())
    .then(data => {
      if (data.success === "true" || data.success === true) {
        showDone(btn);
      } else {
        fallbackSubmit(payload, btn);
      }
    })
    .catch(() => fallbackSubmit(payload, btn));
  }

  function fallbackSubmit(payload, btn) {
    const f = document.createElement("form");
    f.method = "POST";
    f.action = "https://formsubmit.co" + EMAIL;
    for (const key in payload) {
      const inp = document.createElement("input");
      inp.type = "hidden";
      inp.name = key;
      inp.value = payload[key];
      f.appendChild(inp);
    }
    document.body.appendChild(f);
    f.submit();
    showDone(btn);
  }

  function showDone(btn) {
    btn.classList.add("hidden");
    let doneHtml = `<p class="ok">Спасибо! Ваш отзыв и статистика отправлены.</p>`;
    if (finalData.inTarget) {
      doneHtml += `<a class="tg-btn" href="${TG_CHAT_URL}" target="_blank">Перейти в закрытый Telegram-чат протокола</a>`;
    }
    document.getElementById("fb-done").innerHTML = doneHtml;
  }
</script>
</body>
</html>
